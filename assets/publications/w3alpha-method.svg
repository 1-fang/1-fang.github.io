<svg width="1200" height="360" viewBox="0 0 1200 360" class="arch-svg" xmlns="http://www.w3.org/2000/svg"
             style="background:#10151b" role="img" aria-label="News, behaviors and market feed into a recommender and a trading agent; two evaluation taps emerge.">
          <defs>
            <pattern id="archGrid" width="22" height="22" patternUnits="userSpaceOnUse">
              <circle cx="0.5" cy="0.5" r="0.5" fill="rgba(255,255,255,0.05)"/>
            </pattern>
            <marker id="archArrowAmber" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 Z" fill="#FFB454"/>
            </marker>
            <marker id="archArrowGreen" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 Z" fill="#4ADE80"/>
            </marker>
          </defs>

          <rect x="0" y="0" width="1200" height="360" fill="url(#archGrid)"/>

          <!-- ============ CONNECTORS (under boxes) ============ -->
          <g class="arch-flow" fill="none" stroke="#FFB454" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
            <!-- news → recommender -->
            <path d="M 190 54 H 232 V 138 H 270" marker-end="url(#archArrowAmber)"/>
            <!-- users → recommender -->
            <path d="M 190 138 H 270" marker-end="url(#archArrowAmber)"/>
            <!-- market → backtest (long bottom arc) -->
            <path d="M 190 227 H 220 V 332 H 1100 V 208" marker-end="url(#archArrowAmber)"
                  stroke-dasharray="4 3"/>
            <!-- recommender → sentiment factor -->
            <path d="M 470 165 H 540" marker-end="url(#archArrowAmber)"/>
            <!-- sentiment → llm agent -->
            <path d="M 740 165 H 765 V 156 H 790" marker-end="url(#archArrowAmber)"/>
            <!-- llm agent → backtest -->
            <path d="M 990 156 H 1020" marker-end="url(#archArrowAmber)"/>
          </g>

          <g class="arch-flow-eval" fill="none" stroke="#4ADE80" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
            <!-- recommender → ranking eval (branch up) -->
            <path d="M 370 104 V 54 H 540" marker-end="url(#archArrowGreen)"/>
            <!-- backtest → trading eval (branch down) -->
            <path d="M 1100 208 V 240" marker-end="url(#archArrowGreen)"/>
          </g>

          <!-- ============ INPUT CARDS (left column) ============ -->
          <g class="arch-card" font-family="IBM Plex Mono, monospace">
            <!-- NEWS -->
            <rect x="20" y="20" width="170" height="68" rx="3"
                  fill="#181E26" stroke="rgba(255,255,255,0.16)"/>
            <text x="34" y="40" fill="#8B9097" font-size="10" letter-spacing="0.12em">NEWS CORPUS</text>
            <text x="34" y="62" fill="#FFB454" font-size="20" font-weight="600" letter-spacing="-0.01em">732,014</text>
            <text x="34" y="78" fill="#5C6168" font-size="9.5" letter-spacing="0.08em">ARTICLES · 4 YEARS</text>

            <!-- USERS -->
            <rect x="20" y="104" width="170" height="68" rx="3"
                  fill="#181E26" stroke="rgba(255,255,255,0.16)"/>
            <text x="34" y="124" fill="#8B9097" font-size="10" letter-spacing="0.12em">USER BEHAVIORS</text>
            <text x="34" y="146" fill="#FFB454" font-size="20" font-weight="600" letter-spacing="-0.01em">9,701</text>
            <text x="34" y="162" fill="#5C6168" font-size="9.5" letter-spacing="0.08em">SHA-256 HASHED · 5 EVT TYPES</text>

            <!-- MARKET + mini K-line -->
            <rect x="20" y="188" width="170" height="78" rx="3"
                  fill="#181E26" stroke="rgba(255,255,255,0.16)"/>
            <text x="34" y="208" fill="#8B9097" font-size="10" letter-spacing="0.12em">MARKET · TICK</text>
            <text x="34" y="230" fill="#FFB454" font-size="20" font-weight="600" letter-spacing="-0.01em">6 PAIRS</text>
            <text x="34" y="246" fill="#5C6168" font-size="9.5" letter-spacing="0.08em">1-MIN OHLCV · 4 YR</text>
            <!-- candlesticks -->
            <g transform="translate(120,210)" stroke-width="1">
              <line x1="0"  y1="8"  x2="0"  y2="36" stroke="#F87171"/>
              <rect x="-3" y="14" width="6" height="14" fill="#F87171"/>
              <line x1="10" y1="6"  x2="10" y2="34" stroke="#F87171"/>
              <rect x="7"  y="10" width="6" height="20" fill="#F87171"/>
              <line x1="20" y1="10" x2="20" y2="32" stroke="#4ADE80"/>
              <rect x="17" y="16" width="6" height="10" fill="#4ADE80"/>
              <line x1="30" y1="4"  x2="30" y2="28" stroke="#4ADE80"/>
              <rect x="27" y="8"  width="6" height="16" fill="#4ADE80"/>
              <line x1="40" y1="2"  x2="40" y2="22" stroke="#4ADE80"/>
              <rect x="37" y="6"  width="6" height="10" fill="#4ADE80"/>
            </g>
          </g>

          <!-- ============ RECOMMENDER (primary stage) ============ -->
          <g font-family="IBM Plex Mono, monospace">
            <rect x="270" y="104" width="200" height="124" rx="3"
                  fill="#1E2530" stroke="#FFB454" stroke-opacity="0.55"/>
            <line x1="270" y1="104" x2="470" y2="104" stroke="#FFB454" stroke-opacity="0.55" stroke-width="2"/>
            <text x="284" y="124" fill="#FFB454" font-size="10" letter-spacing="0.14em">STAGE 1 · RECOMMENDER</text>
            <text x="284" y="146" fill="#F2F4F7" font-size="12" font-weight="500">15 baselines</text>
            <text x="284" y="166" fill="#C9CFD7" font-size="10.5">SASRec · LSTUR · NRMS</text>
            <text x="284" y="182" fill="#C9CFD7" font-size="10.5">PLM-NR · Prompt4NR</text>
            <text x="284" y="198" fill="#C9CFD7" font-size="10.5">
              <tspan>GPT4Rec </tspan><tspan fill="#FFB454">★</tspan>
            </text>
            <text x="284" y="218" fill="#5C6168" font-size="9.5" letter-spacing="0.1em">CLASSICAL · NEWS · LLM</text>
          </g>

          <!-- ============ RANKING EVAL (top branch) ============ -->
          <g font-family="IBM Plex Mono, monospace">
            <rect x="540" y="20" width="200" height="68" rx="3"
                  fill="#181E26" stroke="rgba(74,222,128,0.45)"/>
            <text x="554" y="40" fill="#4ADE80" font-size="10" letter-spacing="0.14em">EVAL TAP · §3 RANKING</text>
            <text x="554" y="60" fill="#C9CFD7" font-size="10.5">AUC · MRR · nDCG@10</text>
            <text x="554" y="76" fill="#C9CFD7" font-size="10.5">Recall · Precision</text>
          </g>

          <!-- ============ SENTIMENT FACTOR ============ -->
          <g font-family="IBM Plex Mono, monospace">
            <rect x="540" y="124" width="200" height="82" rx="3"
                  fill="#181E26" stroke="rgba(255,255,255,0.16)"/>
            <text x="554" y="144" fill="#8B9097" font-size="10" letter-spacing="0.14em">SENTIMENT FACTOR</text>
            <text x="554" y="164" fill="#C9CFD7" font-size="10.5">per asset · per minute</text>
            <text x="554" y="180" fill="#C9CFD7" font-size="10.5">rolling 1-hour window</text>
            <text x="554" y="196" fill="#5C6168" font-size="9.5">x ∈ [−1, +1]</text>
          </g>

          <!-- ============ LLM AGENT (primary stage) ============ -->
          <g font-family="IBM Plex Mono, monospace">
            <rect x="790" y="104" width="200" height="104" rx="3"
                  fill="#1E2530" stroke="#FFB454" stroke-opacity="0.55"/>
            <line x1="790" y1="104" x2="990" y2="104" stroke="#FFB454" stroke-opacity="0.55" stroke-width="2"/>
            <text x="804" y="124" fill="#FFB454" font-size="10" letter-spacing="0.14em">STAGE 2 · LLM AGENT</text>
            <text x="804" y="146" fill="#F2F4F7" font-size="12" font-weight="500">5 personas</text>
            <text x="804" y="166" fill="#C9CFD7" font-size="10.5">P1 conservative · P2 balanced</text>
            <text x="804" y="182" fill="#C9CFD7" font-size="10.5">P3 swing · P4 aggressive</text>
            <text x="804" y="198" fill="#C9CFD7" font-size="10.5">P5 altcoin</text>
          </g>

          <!-- ============ BACKTEST + mini equity curve ============ -->
          <g font-family="IBM Plex Mono, monospace">
            <rect x="1020" y="104" width="160" height="104" rx="3"
                  fill="#181E26" stroke="rgba(255,255,255,0.16)"/>
            <text x="1034" y="124" fill="#8B9097" font-size="10" letter-spacing="0.14em">BACKTEST</text>
            <text x="1034" y="142" fill="#C9CFD7" font-size="10">fees · slip · funding</text>
            <!-- mini equity curve -->
            <polyline points="1034,188 1048,182 1060,186 1074,172 1088,176 1102,160 1116,162 1132,148 1148,152 1164,134"
                      fill="none" stroke="#4ADE80" stroke-width="1.5"/>
            <text x="1034" y="200" fill="#5C6168" font-size="9">equity curve (illustrative)</text>
          </g>

          <!-- ============ TRADING EVAL (bottom branch, wide) ============ -->
          <g font-family="IBM Plex Mono, monospace">
            <rect x="540" y="240" width="640" height="68" rx="3"
                  fill="#181E26" stroke="rgba(74,222,128,0.45)"/>
            <text x="554" y="260" fill="#4ADE80" font-size="10" letter-spacing="0.14em">EVAL TAP · §3 TRADING</text>
            <text x="554" y="282" fill="#C9CFD7" font-size="10.5">NAS−TOS · Sharpe · MaxDD · Win-rate</text>
            <text x="554" y="298" fill="#5C6168" font-size="9.5">per persona × 6 spot pairs · 80 % win-rate aggregate</text>
          </g>

          <!-- bottom legend -->
          <g font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="0.08em">
            <line x1="20" y1="346" x2="38" y2="346" stroke="#FFB454" stroke-width="1.4"/>
            <text x="44" y="349" fill="#8B9097">data flow</text>
            <line x1="120" y1="346" x2="138" y2="346" stroke="#FFB454" stroke-width="1.4" stroke-dasharray="4 3"/>
            <text x="144" y="349" fill="#8B9097">market feed</text>
            <line x1="240" y1="346" x2="258" y2="346" stroke="#4ADE80" stroke-width="1.4"/>
            <text x="264" y="349" fill="#8B9097">evaluation tap</text>
          </g>
        </svg>